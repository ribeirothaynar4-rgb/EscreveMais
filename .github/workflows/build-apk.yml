name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SM=""
          for c in "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/cmdline-tools/bin/sdkmanager"; do
            if [ -x "$c" ]; then SM="$c"; break; fi
          done
          if [ -z "$SM" ]; then
            SM="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          yes | "$SM" --licenses >/dev/null || true
          "$SM" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build signed APK
        run: gradle :app:assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/EscreveMais.apk
          unzip -l dist/EscreveMais.apk | head -40

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EscreveMais-APK
          path: dist/EscreveMais.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.1-free
          name: Escreve+ 1.1.1 (modo gratuito)
          body: |
            APK **assinado** do Escreve+ (modo gratuito protegido).

            - Toque em **EscreveMais.apk** para baixar.
            - No Android, permita instalar apps desta fonte se o sistema pedir.
            - Depois abra o app, cole sua chave gratuita da Gemini API e ative o assistente em Acessibilidade.
          files: dist/EscreveMais.apk
          draft: false
          make_latest: true
