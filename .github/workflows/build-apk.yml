name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SM=""
          for c in "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/cmdline-tools/bin/sdkmanager"; do
            if [ -x "$c" ]; then SM="$c"; break; fi
          done
          if [ -z "$SM" ]; then
            SM="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          yes | "$SM" --licenses >/dev/null || true
          "$SM" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build signed APK
        run: gradle :app:assembleRelease

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/EscreveMais.apk
          unzip -l dist/EscreveMais.apk | head -40

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EscreveMais-APK
          path: dist/EscreveMais.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.1-free
          name: Escreve+ 1.2.1 (IA mais rápida)
          body: |
            Correção: a IA demorava e falhava no Xiaomi.

            - Resposta mais rápida (sem o modo "pensar" da Gemini)
            - Só envia a conversa da tela em Responder / Desculpa / Ideia
            - Mostra o erro real se falhar
            - Tenta de novo sozinho se a rede oscilar

            Desinstale a versão antiga e instale este APK.
          files: dist/EscreveMais.apk
          draft: false
          make_latest: true
